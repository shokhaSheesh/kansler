<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Kansler empty-state illustration: brand navy #101828, accent #08E18A, greys from the palette -->
  <ellipse cx="120" cy="158" rx="78" ry="9" fill="#EAECF0"/>

  <!-- floating sheet of paper -->
  <g transform="rotate(-8 128 52)">
    <rect x="101" y="18" width="54" height="68" rx="6" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
    <rect x="111" y="31" width="34" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="111" y="41" width="26" height="4" rx="2" fill="#E4E7EC"/>
    <rect x="111" y="51" width="30" height="4" rx="2" fill="#E4E7EC"/>
    <rect x="111" y="61" width="18" height="4" rx="2" fill="#E4E7EC"/>
  </g>

  <!-- box back + inside -->
  <path d="M62 86 L120 70 L178 86 L120 102 Z" fill="#E4E7EC"/>
  <!-- open flaps -->
  <path d="M62 86 L120 102 L101 120 L43 104 Z" fill="#F2F4F7" stroke="#101828" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M178 86 L120 102 L139 120 L197 104 Z" fill="#F2F4F7" stroke="#101828" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- box body -->
  <path d="M62 86 L62 136 L120 152 L120 102 Z" fill="#FFFFFF" stroke="#101828" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M178 86 L178 136 L120 152 L120 102 Z" fill="#F9FAFB" stroke="#101828" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- tape -->
  <path d="M76 112 L106 120.5" stroke="#D0D5DD" stroke-width="2.5" stroke-linecap="round"/>

  <!-- sparkles and dots -->
  <path d="M190 40 L193 49 L202 52 L193 55 L190 64 L187 55 L178 52 L187 49 Z" fill="#08E18A"/>
  <circle cx="52" cy="58" r="5" fill="#08E18A" opacity="0.5"/>
  <circle cx="40" cy="80" r="3" fill="#D0D5DD"/>
  <circle cx="206" cy="84" r="3.5" fill="#D0D5DD"/>
  <path d="M64 30 L66 36 L72 38 L66 40 L64 46 L62 40 L56 38 L62 36 Z" fill="#101828" opacity="0.85"/>
</svg>
